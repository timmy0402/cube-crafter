name: Trigger auto deployment for rubik-bot

# When this action will be executed
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          DEV_SQL_HOST: "localhost"
          DEV_SQL_DATABASE: "testdb"
          DEV_SQL_USERNAME: "testuser"
          DEV_SQL_PASSWORD: "testpass"
          AZURE_STORAGE_ACCOUNT_URL: ""
          AZURE_STORAGE_ACCESS_KEY: ""
          AZURE_STORAGE_CONTAINER_NAME: ""
          APPLICATION_ID: "000000000000000000"
        run: pytest test/ -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RUBIKBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RUBIKBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RUBIKBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: docker.io
          registryUsername: ${{ secrets.RUBIKBOT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RUBIKBOT_REGISTRY_PASSWORD }}
          containerAppName: rubik-bot
          resourceGroup: rubik_bot
          imageToBuild: timhmn/cube-crafter:${{ github.sha }}


